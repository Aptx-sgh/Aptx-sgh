<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just the way you are</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('max_meo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ff5690;
        }
        p {
            font-size: 14px;
            color: #ffa3bd;
            margin-bottom: 30px;
        }
        .status-text {
            font-style: italic;
            color: #85beff;
            margin-top: 15px;
            font-size: 13px;
        }
        audio {
            width: 60%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>𝘫𝘶𝘴𝘵 𝘵𝘩𝘦 𝘸𝘢𝘺 𝘺𝘰𝘶 𝘢𝘳𝘦.</h1>
        <p>ᴍɪʟᴋʏ</p>
        
        <audio id="musicPlayer" loop controls>
    <source src="lovely.mp3" type="audio/mpeg">
    Trình duyệt của bạn không hỗ trợ phát âm thanh.
</audio>

        <p id="status" class="status-text">Đang cố gắng tự động phát nhạc...</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('musicPlayer');
            const status = document.getElementById('status');
                status.textContent = "⚡ Click on Max!!";
                status.style.color="#85beff";
        });
    </script>
    
    <script>                            
                document.addEventListener('click', () => {
                    audio.play();
                    status.textContent = "🎀 ྀིྀི Max is singing ♥";
                    status.style.color = "#ffd79f";
                }, { once: true }); 
            });
        });
    </script>

</body>
</html>
